name: Build MSVC with Libsodium

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
    - name: Kodu GitHub'dan Cek
      uses: actions/checkout@v4

    - name: Libsodium Kutuphanesini Yukle (vcpkg)
      # x86-windows-static kullanarak her şeyi tek bir EXE'de topluyoruz
      run: vcpkg install libsodium:x86-windows-static

    - name: MSVC x86 (32-bit) Ortamini Ayarla
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Derle (cl.exe)
      shell: cmd
      run: |
        cl.exe /O2 /MT verify.cpp ^
        /I "%VCPKG_INSTALLATION_ROOT%\installed\x86-windows-static\include" ^
        /link /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\installed\x86-windows-static\lib" ^
        libsodium.lib user32.lib advapi32.lib ^
        /OUT:CrackMe.exe

    - name: EXE Dosyasini Artifact Olarak Yukle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CrackMe-Build-Sonucu
        path: CrackMe.exe
