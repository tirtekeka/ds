name: Build JIT Hook DLL (x86)

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86 # <--- 32-bit derleyiciyi zorla

      - name: Compile (32-bit DLL)
        shell: cmd
        run: |
            cl.exe /O2 /LD /MT /EHsc jithook.cpp /link /OUT:jithook_x86.dll

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jithook-32bit
          path: jithook_x86.dll
