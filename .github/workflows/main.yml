name: Build MSVC with Libsodium

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Kodu Cek
      uses: actions/checkout@v4

    - name: Libsodium Yukle (vcpkg)
      run: vcpkg install libsodium:x86-windows-static

    - name: MSVC x86 Ortamini Ayarla
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Derle (cl.exe)
      shell: cmd  # PowerShell yerine CMD kullanarak ^ karakterini geçerli kılıyoruz
      run: |
        cl.exe /O2 /MT verify.cpp ^
        /I "%GITHUB_WORKSPACE%\vcpkg_installed\x86-windows-static\include" ^
        /link /LIBPATH:"%GITHUB_WORKSPACE%\vcpkg_installed\x86-windows-static\lib" ^
        libsodium.lib user32.lib advapi32.lib ^
        /OUT:CrackMe.exe

    - name: EXE Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: CrackMe-Build
        path: CrackMe.exe
