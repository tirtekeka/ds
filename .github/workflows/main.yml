name: Build Password Checker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev build-essential

      - name: Compile (GCC)
        run: |
          gcc main.c -o checker_linux -lsodium

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checker-linux
          path: checker_linux

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          vcpkg install libsodium:x64-windows-static

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Compile (MSVC)
        shell: cmd
        run: |
          cl.exe /O2 /MT main.c /I %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\include /link /LIBPATH:%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib libsodium.lib user32.lib advapi32.lib /OUT:checker_win.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checker-windows
          path: checker_win.exe
