name: Build jithook DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build DLL
        run: |
          cl.exe /LD /O2 /EHsc /Fe:jithook.dll jithook.cpp /link /MACHINE:X86 kernel32.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jithook-dll
          path: jithook.dll
